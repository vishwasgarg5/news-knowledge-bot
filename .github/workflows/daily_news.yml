name: Daily News Knowledge Brief

on:
  schedule:
    - cron: '30 1 * * *' # 07:00 Asia/Kolkata (IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          curl -sf http://localhost:11434/api/tags >/dev/null

      - name: Pull free local model
        run: ollama pull qwen2.5:7b

      - name: Generate and send morning briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ollama
          AI_MODEL: qwen2.5:7b
          OLLAMA_MODEL: qwen2.5:7b
          OLLAMA_URL: http://localhost:11434/api/generate
        run: python -m app.main

      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log || true

      - name: Commit updated knowledge CSVs
        run: |
          git config user.name "news-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update daily knowledge memory"
          git push
