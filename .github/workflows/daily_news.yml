name: Daily News Knowledge Brief

on:
  schedule:
    - cron: '30 1 * * *' # 07:00 Asia/Kolkata (IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure persistent Ollama model directory
        run: |
          echo "OLLAMA_MODELS=${{ github.workspace }}/.ollama/models" >> "$GITHUB_ENV"
          mkdir -p "${{ github.workspace }}/.ollama/models"

      - name: Restore Ollama model cache
        uses: actions/cache@v4
        with:
          path: .ollama/models
          key: ollama-qwen2.5-7b-v2-${{ runner.os }}
          restore-keys: |
            ollama-qwen2.5-7b-v2-${{ runner.os }}-
            ollama-qwen2.5-7b-v2-

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..45}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo "[PASS] Ollama service ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null

      - name: Ensure free local model is available
        env:
          OLLAMA_MODEL: qwen2.5:7b
        run: |
          if ollama list | awk '{print $1}' | grep -Fxq "$OLLAMA_MODEL"; then
            echo "[PASS] Ollama model available from cache: $OLLAMA_MODEL"
          else
            echo "[INFO] Cache miss; downloading $OLLAMA_MODEL into $OLLAMA_MODELS"
            ollama pull "$OLLAMA_MODEL"
          fi
          ollama list
          test -d "$OLLAMA_MODELS" || (echo "[FAIL] Model directory missing"; exit 1)

      - name: Generate and send morning briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ollama
          AI_MODEL: qwen2.5:7b
          OLLAMA_MODEL: qwen2.5:7b
          OLLAMA_URL: http://localhost:11434/api/generate
          AI_CONTEXT: '2048'
          AI_MAX_OUTPUT: '500'
          AI_TIMEOUT_SECONDS: '120'
        run: python -m app.main

      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log || true

      - name: Commit updated knowledge CSVs
        if: success()
        run: |
          git config user.name "news-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update daily knowledge memory"
          git push
