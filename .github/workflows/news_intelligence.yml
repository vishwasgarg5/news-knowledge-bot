name: News Intelligence

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose production briefing, validation only, or offline review packet"
        required: true
        type: choice
        options:
          - production
          - validate
          - review-packet
        default: review-packet
      record_path:
        description: "Historical capture JSON under data/historical_evaluation_records/"
        required: true
        type: string
        default: "data/historical_evaluation_records/20261022T062359+0530-morning.json"
      sample_per_disposition:
        description: "Maximum candidates sampled from each disposition (1-100)"
        required: true
        type: number
        default: 25
      seed:
        description: "Stable sampling seed for reproducibility"
        required: true
        type: string
        default: "review-2026-10"
  schedule:
    # 04:07 Asia/Kolkata = 22:37 UTC on the previous day.
    - cron: '37 22 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Validate configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path("config/sources.yaml"), Path("config/preferences.yaml")):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(value, dict), f"{path} must contain a YAML mapping"
          print("Configuration files validated")
          PY
      - name: Run regression contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Print offline verification-gap report
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/analyze_verification_gaps.py
      - name: Run offline shadow verification evaluation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/shadow_verification_eval.py
      - name: Audit historical evaluation readiness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit_historical_eval_readiness.py --json
      - name: Audit captured evaluation review queue
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit_evaluation_captures.py --json
      - name: Audit evaluation capture quality trend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/audit_capture_quality_trend.py --json --fail-on-regression
      - name: Report offline human-reviewed candidate metrics
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/evaluate_historical_records.py data/historical_evaluation_records --json
      - name: Audit installed dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --local

  build-review-packet:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'review-packet'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate request and create private temporary outputs
        id: packet
        env:
          RECORD_PATH: ${{ inputs.record_path }}
          SAMPLE_CAP: ${{ inputs.sample_per_disposition }}
          SAMPLE_SEED: ${{ inputs.seed }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          case "$RECORD_PATH" in
            data/historical_evaluation_records/*.json) ;;
            *) echo "::error::Record must be a JSON file under data/historical_evaluation_records/"; exit 1 ;;
          esac
          test -f "$RECORD_PATH"
          case "$SAMPLE_CAP" in
            ''|*[!0-9]*) echo "::error::Sample cap must be a positive integer"; exit 1 ;;
          esac
          test "$SAMPLE_CAP" -ge 1
          test "$SAMPLE_CAP" -le 100
          test -n "$SAMPLE_SEED"
          workdir="$(mktemp -d "$RUNNER_TEMP/blinded-review.XXXXXX")"
          queue="$workdir/review-queue.json"
          key="$workdir/answer-key.private.json"
          report="$workdir/packet-validation.json"
          python scripts/build_blinded_review_packet.py "$RECORD_PATH" \
            --queue-output "$queue" \
            --key-output "$key" \
            --sample-per-disposition "$SAMPLE_CAP" \
            --seed "$SAMPLE_SEED"
          python scripts/validate_blinded_review_packet.py "$queue" "$key" --json > "$report"
          python - "$queue" "$report" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          queue_path, report_path, output_path = map(Path, sys.argv[1:])
          queue = json.loads(queue_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if not report.get("valid") or report.get("packet_items", 0) < 1:
              raise SystemExit("Generated review packet did not pass validation")
          counts = queue.get("sampling", {}).get("selected_by_disposition", {})
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"queue_path={queue_path}\n")
              handle.write(f"item_count={report['packet_items']}\n")
              handle.write(f"included={counts.get('included', 0)}\n")
              handle.write(f"excluded={counts.get('excluded', 0)}\n")
          print("Blinded queue validated. No human labels were created.")
          print(f"Selected candidates: {report['packet_items']}")
          print("The pipeline answer key will not be uploaded.")
          PY
          rm -f "$key" "$report"
      - name: Upload blinded reviewer queue only
        uses: actions/upload-artifact@v7
        with:
          name: blinded-review-queue
          path: ${{ steps.packet.outputs.queue_path }}
          if-no-files-found: error
          retention-days: 14
      - name: Summarize packet
        env:
          ITEM_COUNT: ${{ steps.packet.outputs.item_count }}
          INCLUDED_COUNT: ${{ steps.packet.outputs.included }}
          EXCLUDED_COUNT: ${{ steps.packet.outputs.excluded }}
        run: |
          {
            echo "## Blinded candidate review packet created"
            echo
            echo "- Queue items: $ITEM_COUNT"
            echo "- Included stratum: $INCLUDED_COUNT"
            echo "- Excluded stratum: $EXCLUDED_COUNT"
            echo "- Artifact: blinded-review-queue (14-day retention)"
            echo "- Answer key: not uploaded"
            echo "- Production news run / Telegram delivery: not invoked"
            echo
            echo "Only reviewers should receive the queue artifact. Repository collaborators with Actions access may be able to download artifacts; do not treat this artifact as access-controlled reviewer distribution."
          } >> "$GITHUB_STEP_SUMMARY"
  run-news:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production'))
    needs: validate
    permissions:
      contents: write
    concurrency:
      group: news-intelligence
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure Ollama cache
        run: |
          echo "OLLAMA_MODELS=${{ github.workspace }}/.ollama/models" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ollama/models"
      - uses: actions/cache@v5
        with:
          path: .ollama/models
          key: ollama-qwen2.5-3b-v8-${{ runner.os }}
          restore-keys: ollama-qwen2.5-3b-v8-
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          pkill -f 'ollama serve' || true
          OLLAMA_MODELS="$OLLAMA_MODELS" nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..45}; do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          curl -sf http://localhost:11434/api/tags >/dev/null
      - name: Ensure Qwen
        run: |
          if ! ollama list | awk '{print $1}' | grep -Fxq 'qwen2.5:3b'; then
            ollama pull qwen2.5:3b
          fi
      - name: Validate Python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q app
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path("config/sources.yaml").read_text(encoding="utf-8"))
          yaml.safe_load(Path("config/preferences.yaml").read_text(encoding="utf-8"))
          from app.intelligence import enrich_trends, personalize
          sample=[{"headline":"India economy update","importance":70,"category":"economy","region":"india"}]
          x=personalize(enrich_trends(sample,[]), yaml.safe_load(Path("config/preferences.yaml").read_text(encoding="utf-8")))
          assert x and "personalized_score" in x[0] and "breaking_score" in x[0]
          from app.storage import ensure_data, sync_sqlite, validate_data
          root=Path("data"); ensure_data(root); db=sync_sqlite(root); assert db.exists()
          quality=validate_data(root); assert quality["ok"], quality["issues"]
          import sqlite3
          with sqlite3.connect(db) as con:
              assert con.execute("select name from sqlite_master where type='table' and name='learning_outcomes'").fetchone() is not None
          from app.analytics import build_report
          report=build_report(root)
          assert "avg_outcome" in report and "source_reliability" in report and "category_reliability" in report
          from app.ai import rerank_stories
          ranked=rerank_stories([{"story_id":"smoke","headline":"India economy update","importance":75,"personalized_score":86,"breaking_score":50,"trend_score":70,"region":"india","region_confidence":0.9,"source":"Reuters","url":"https://example.com"}],{"smoke":{"verification":"official-source","confidence":95,"independent_sources":0}})
          assert ranked and ranked[0].get("personalization_applied")==86
          from app.main import _event_status
          assert _event_status({"headline":"Storm escalation","importance":80,"event_id":"e","verification":{"verification":"multi-source","independent_sources":2}},[{"event_id":"e","importance":70}])=="ESCALATING"
          assert _event_status({"headline":"Case resolved","importance":70,"event_id":"r","verification":{"verification":"official-source","independent_sources":0}})== "RESOLVED"
          print("Configuration, intelligence, personalization, SQLite and analytics validation passed")
          PY
          python - <<'PY'
          from app.ai import _fallback_how, _fallback_why, _fallback_background, _fallback_impact, _fallback_next
          sample={"headline":"Example launch announced","summary":"The company launched the product using a new manufacturing process. The company was founded in 2018 and has operated for years."}
          assert _fallback_how(sample) and _fallback_background(sample)
          assert _fallback_impact({"summary":"The company changed its manufacturing process. The change could materially reduce production time for manufacturers and affect costs."})
          assert _fallback_next({"summary":"Officials said the company plans to begin trials next month."})
          assert _fallback_why({"summary":"The move was made because demand increased significantly."})
          print("News enrichment smoke tests passed")
          PY
      - name: Production freeze gate
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          case "${{ github.event_name }}" in
            schedule) ;;
            workflow_dispatch)
              test "${{ inputs.mode }}" = "production"
              ;;
            *) echo "::error::Production is allowed only on schedule or explicit production dispatch"; exit 1 ;;
          esac
          grep -q "needs: validate" .github/workflows/news_intelligence.yml
          grep -q "python -m app.main" .github/workflows/news_intelligence.yml
          echo "Production freeze gate passed"

      - name: Validate runtime configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_MODEL: qwen2.5:3b
          OLLAMA_URL: http://localhost:11434/api/generate
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::TELEGRAM_BOT_TOKEN is missing"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::TELEGRAM_CHAT_ID is missing"; exit 1; }
          ollama list | awk '{print $1}' | grep -Fxq "$AI_MODEL" || { echo "::error::Required model $AI_MODEL is not installed"; exit 1; }
          curl -sf "$OLLAMA_URL" -H 'Content-Type: application/json' -d "{\"model\":\"$AI_MODEL\",\"prompt\":\"Reply with OK only\",\"stream\":false,\"options\":{\"num_predict\":8}}" | grep -q 'response' || { echo "::error::Ollama inference health check failed"; exit 1; }
          echo "Runtime configuration validation passed"
      - name: Generate news briefing
        env:
          PYTHONHASHSEED: '0'
          PIP_NO_INPUT: '1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ollama
          AI_MODEL: qwen2.5:3b
          OLLAMA_MODEL: qwen2.5:3b
          OLLAMA_URL: http://localhost:11434/api/generate
          AI_CONTEXT: '1536'
          AI_MAX_OUTPUT: '160'
          AI_TIMEOUT_SECONDS: '45'
          AI_RETRY_TIMEOUT_SECONDS: '60'
          AI_STORY_BUDGET: '6'
          AI_DEEP_IMPORTANCE: '75'
          NEWS_MIN_IMPORTANCE: '62'
          NEWS_CANDIDATE_LIMIT: '700'
          NEWS_CATEGORY_RESEARCH_QUERIES: '8'
          NEWS_MAX_STORIES: '10'
          NEWS_MIN_STORIES_TARGET: '6'
          NEWS_MAX_SINGLE_SOURCE_PER_REGION: '5'
          NEWS_MAX_STORIES_PER_SOURCE: '2'
          NEWS_MAX_EVENT_FAMILY: '2'
          NEWS_SINGLE_SOURCE_MIN_IMPORTANCE: '80'
          NEWS_INDIA_MIN_REGION_CONFIDENCE: '0.45'
          NEWS_MIN_VERIFICATION_FOR_LEARNING: 'multi-report'
          NEWS_MAX_PER_CATEGORY: '8'
          NEWS_INDIA_TOP: '5'
          NEWS_WORLD_TOP: '5'
          RUN_SLOT: morning
          PYTHONUNBUFFERED: '1'
        run: python -m app.main
      - name: Validate final audit artifact
        if: success()
        run: |
          test -s /tmp/news_briefing.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("/tmp/news_briefing.json").read_text(encoding="utf-8"))
          assert {"date","stats","stories"} <= data.keys()
          stats=data["stats"]
          assert "final_audit" in stats and "operational_health" in stats
          assert (stats["final_audit"] or {}).get("health") in {"PASS","WARN","DEGRADED"}
          assert "backtest_v4" in stats
          assert "monitoring_alerts" in stats
          assert "source_fallback_order" in stats
          assert "intelligence_v4_diagnosis" in stats
          assert "strategy_comparison" in stats
          assert "production_decision" in stats
          assert "intelligence_v5" in stats
          assert "intelligence_scorecard" in stats
          assert "research_queue" in stats
          assert "intelligence_v5_plus" in stats
          assert "smart_alerts" in stats
          assert "knowledge_graph" in stats
          assert "evidence_gaps" in stats
          assert "v5_walk_forward" in stats
          assert "v5_ab_test" in stats
          assert "v5_calibration" in stats
          assert "v5_drift" in stats
          assert "v5_production_evaluation" in stats
          assert "v5_quality_gate" in stats
          assert (stats["v5_quality_gate"] or {}).get("status") in {"PASS","HOLD"}
          assert "research_completion_rate" in stats
          assert "selection_diagnostics" in stats
          assert "rejections" in stats["selection_diagnostics"]
          assert 0.0 <= float(stats["research_completion_rate"]) <= 1.0
          assert "v5_research_agent" in stats
          assert (stats["production_decision"] or {}).get("status") in {"PROMOTE","HOLD"}
          assert "research_target_selection" in stats
          assert "research_discovery" in stats
          assert "research_verification" in stats
          target_selection=stats.get("research_target_selection") or {}
          discovery=stats.get("research_discovery") or {}
          verification=stats.get("research_verification") or {}
          assert 0 <= int(target_selection.get("selected",0) or 0) <= int(target_selection.get("preflight_candidates",0) or 0)
          assert 0 <= int(target_selection.get("zero_independent_candidates",0) or 0) <= int(target_selection.get("preflight_candidates",0) or 0)
          assert int(discovery.get("articles_found",0) or 0) >= 0
          assert int(discovery.get("unique_publishers",0) or 0) <= int(discovery.get("articles_found",0) or 0)
          assert 0 <= int(discovery.get("matched_articles",0) or 0) <= int(discovery.get("articles_found",0) or 0)
          assert 0.0 <= float(discovery.get("match_rate",0) or 0) <= 1.0
          assert 0.0 <= float(verification.get("independent_source_coverage",0) or 0) <= 1.0
          # A held research/coverage gate must not be reported as a clean final audit.
          gate=stats.get("v5_quality_gate") or {}
          final=stats.get("final_audit") or {}
          blockers=set(gate.get("blockers") or [])
          if blockers:
              assert final.get("health") != "PASS", "Final audit must surface evidence/coverage blockers"
          scorecard=stats.get("intelligence_scorecard") or {}
          assert 0 <= int(scorecard.get("verified",0) or 0) <= int(scorecard.get("stories",0) or 0)
          completion=float(stats.get("research_completion_rate",0) or 0)
          assert 0.0 <= completion <= 1.0
          print("Final audit artifact validated with production gate consistency checks")
          PY

      - name: Upload final briefing audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-briefing-audit
          path: /tmp/news_briefing.json
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
          echo "=== Git status ==="
          git status --short
      # The production job owns only the generated data/ memory. There is no
      # push trigger, so this commit cannot recursively start this workflow.
      - name: Commit news memory safely
        if: success()
        run: |
          set -euo pipefail
          git config user.name "news-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "No memory changes to commit" && exit 0
          git commit -m "Update news memory"

          # Rebase/push with a small retry window in case another memory commit
          # lands on main between fetch and push.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || {
              echo "::warning::Rebase failed on attempt $attempt"
              git rebase --abort || true
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep $((attempt * 3))
              continue
            }
            if git push origin HEAD:main; then
              echo "News memory pushed successfully on attempt $attempt"
              exit 0
            fi
            echo "::warning::Push race detected on attempt $attempt"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 3)); fi
          done
          exit 1
