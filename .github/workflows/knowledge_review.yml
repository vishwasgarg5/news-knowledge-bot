name: Knowledge Review

on:
  schedule:
    - cron: '30 2 * * 0' # Sunday 08:00 IST
    - cron: '30 2 1 * *' # 1st day of month 08:00 IST
  workflow_dispatch:
    inputs:
      review_type:
        description: 'weekly or monthly'
        required: true
        default: weekly

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-v1
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null
      - name: Ensure free local model is available
        run: |
          if ollama list | awk '{print $1}' | grep -Fxq 'qwen2.5:7b'; then
            echo "[PASS] Model cached: qwen2.5:7b"
          else
            ollama pull qwen2.5:7b
          fi
      - name: Determine review type
        id: type
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.review_type }}" ]; then
            echo "type=${{ github.event.inputs.review_type }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%d)" = "01" ]; then
            echo "type=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "type=weekly" >> "$GITHUB_OUTPUT"
          fi
      - name: Send review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_MODEL: qwen2.5:7b
          OLLAMA_MODEL: qwen2.5:7b
          OLLAMA_URL: http://localhost:11434/api/generate
        run: python -m app.review "${{ steps.type.outputs.type }}"
      - name: Show Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log || true
