name: Knowledge Review

on:
  schedule:
    - cron: '30 2 * * 0' # Sunday 08:00 IST
    - cron: '30 2 1 * *' # 1st day of month 08:00 IST
  workflow_dispatch:
    inputs:
      review_type:
        description: 'weekly or monthly'
        required: true
        default: weekly

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Determine review type
        id: type
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.review_type }}" ]; then
            echo "type=${{ github.event.inputs.review_type }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%d)" = "01" ]; then
            echo "type=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "type=weekly" >> "$GITHUB_OUTPUT"
          fi
      - name: Send review
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python -m app.review "${{ steps.type.outputs.type }}"
