name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app
      - name: Validate configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in (Path("config/sources.yaml"), Path("config/preferences.yaml")):
              value = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert isinstance(value, dict), f"{path} must contain a YAML mapping"
          print("Configuration files validated")
          PY
      - name: Run regression contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q
      - name: Audit installed dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit --local
