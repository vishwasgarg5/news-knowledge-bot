name: News Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: news-intelligence
  cancel-in-progress: false

jobs:
  run-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configure Ollama cache
        run: |
          echo "OLLAMA_MODELS=${{ github.workspace }}/.ollama/models" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ollama/models"
      - uses: actions/cache@v5
        with:
          path: .ollama/models
          key: ollama-qwen2.5-3b-v8-${{ runner.os }}
          restore-keys: ollama-qwen2.5-3b-v8-
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          pkill -f 'ollama serve' || true
          OLLAMA_MODELS="$OLLAMA_MODELS" nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..45}; do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          curl -sf http://localhost:11434/api/tags >/dev/null
      - name: Ensure Qwen
        run: |
          if ! ollama list | awk '{print $1}' | grep -Fxq 'qwen2.5:3b'; then
            ollama pull qwen2.5:3b
          fi
      - name: Validate Python
        run: |
          python -m compileall -q app
          python - <<'PY'
          from pathlib import Path
          import yaml
          yaml.safe_load(Path("config/sources.yaml").read_text(encoding="utf-8"))
          print("Configuration validation passed")
          PY
          python - <<'PY'
          from app.ai import _fallback_how, _fallback_why, _fallback_background, _fallback_impact, _fallback_next
          sample={"headline":"Example launch announced","summary":"The company launched the product using a new manufacturing process. Previously, it had been developing the platform for years. The change could reduce production time."}
          assert _fallback_how(sample)
          assert _fallback_background(sample)
          assert _fallback_impact({"summary":"The change could materially reduce production time for manufacturers and affect costs."})
          assert _fallback_next({"summary":"Officials said the company plans to begin trials next month."})
          assert _fallback_why({"summary":"The move was made because demand increased significantly."})
          print("News enrichment smoke tests passed")
          PY
      - name: Generate news briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AI_PROVIDER: ollama
          AI_MODEL: qwen2.5:3b
          OLLAMA_MODEL: qwen2.5:3b
          OLLAMA_URL: http://localhost:11434/api/generate
          AI_CONTEXT: '1536'
          AI_MAX_OUTPUT: '160'
          AI_TIMEOUT_SECONDS: '10'
          AI_STORY_BUDGET: '1'
          AI_DEEP_IMPORTANCE: '75'
          NEWS_MIN_IMPORTANCE: '62'
          NEWS_CANDIDATE_LIMIT: '700'
          NEWS_MAX_STORIES: '0'
          NEWS_MAX_PER_CATEGORY: '8'
          RUN_SLOT: morning
          PYTHONUNBUFFERED: '1'
        run: python -m app.main
      - if: failure()
        run: |
          echo "=== Ollama log ==="
          cat /tmp/ollama.log || true
          echo "=== Git status ==="
          git status --short
      - name: Commit news memory safely
        if: success()
        run: |
          git config user.name "news-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update news memory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
